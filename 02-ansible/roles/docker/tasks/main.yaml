---
- name: Install dependencies
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes
- name: Add GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
- name: Add Docker repository
  apt_repository:
    repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present
- name: Install Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
- name: Start Docker service
  service:
    name: docker
    state: started
    enabled: yes
- name: Create "docker" group
  group:
    name: "docker"
    state: present
- name: Add remote user to "docker" group
  user:
    name: "{{ ansible_ssh_user }}"
    group: "docker"
    append: yes