apiVersion: v1
kind: Namespace
metadata: 
  name: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: app
  labels: 
    app: app
spec: 
  replicas: 3
  selector:
    matchLabels: 
      app: app
  template:
    metadata:
      labels: 
        app: app
    spec: 
      containers:
      - name: app
        image: suro4ek/cloudru:latest
        ports:
        - containerPort: 8080
        env: 
        - name: AUTHOR
          value: "suro4ek"
        readinessProbe:
          httpGet: 
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: 
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
      imagePullSecrets:
      - name: docker-registry-secret
---
apiVersion: v1
kind: Service
metadata: 
  name: app-service
  namespace: app
spec:
  selector:
    app: app
  ports: 
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: app
  annotations: 
    kubernetes.io/ingress.class: nginx
spec: 
  rules: 
  - host: app.suro4ek.ru
    http:
      paths: 
      - path: /
        pathType: Prefix
        backend: 
          service: 
            name: app-service
            port:
              number: 8080